name: Preview (Browser)

# Deploys a clickable Browser Preview of every PR: the full BetterShape UI
# with a mocked Tauri backend (lib/preview/tauri-mock.ts), so reviewers and
# agents can click through the change without building the desktop app.
#
# Job 1 `preview` (NO secrets, safe for PR-controlled code incl. forks):
#   build the static preview bundle -> Playwright smoke/audit against it ->
#   upload the bundle + reports + a staged Vercel Build Output tree.
# Job 2 `deploy-preview` (secrets live ONLY here, never checks out PR code):
#   downloads the staged build output and `vercel deploy --prebuilt`s it,
#   then posts the sticky PR comment and optional Morph AI QA.
# Keeping secrets out of the job that executes PR code is deliberate
# (CodeAnt): a docs-only PR must never run in the same job as VERCEL_TOKEN.
# This workflow is deliberately NOT a required status check.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Browser Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "false"
          install-system-deps: "false"

      - run: npm ci --ignore-scripts

      - name: Build Browser Preview bundle
        run: npm run build:preview

      - name: Install Chromium for Playwright
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Playwright against the static bundle
        # Visual baselines are OS/font-sensitive and stay a local gate for
        # now (see e2e/README.md); everything else runs here.
        run: ./node_modules/.bin/playwright test --grep-invert @visual
        env:
          E2E_STATIC: "1"

      - name: Stage Vercel Build Output API tree
        # The deploy job uploads this verbatim with `vercel deploy
        # --prebuilt`, so no repo code (and no build) runs near the token.
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R out/. .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json

      - name: Upload preview bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-${{ github.sha }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Vercel build output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output-${{ github.sha }}
          path: .vercel/output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  deploy-preview:
    name: Deploy preview to Vercel
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No actions/checkout here by design: this job holds the secrets and
      # must never execute code from the PR head.
      - name: Check Vercel secrets
        id: vercel-check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not configured — skipping live deploy. The static bundle is in the workflow artifacts; see docs/developing/browser-preview.mdx to enable."
          fi

      - name: Download staged build output
        if: steps.vercel-check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: vercel-output-${{ github.sha }}
          path: .vercel/output

      - name: Deploy to Vercel (preview)
        id: vercel-deploy
        if: steps.vercel-check.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # What `vercel pull` would write; env alone is not honored by
          # every CLI version for --prebuilt deploys.
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          # Pinned CLI, installed locally (version-locked, no install scripts,
          # never `npx` resolving a floating tag from the registry).
          npm install --prefix .vercel-cli vercel@64.0.2 --ignore-scripts --no-audit --no-fund
          URL=$(./.vercel-cli/node_modules/.bin/vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $URL"

      # Optional AI QA of the deployed preview (Morph). Skips unless the
      # MORPH_API_KEY secret exists; also requires the Morph GitHub App
      # ("Morph Subagents") installed on the repo. Morph explores the UI
      # this PR changed and posts a video + results on the PR. This is
      # exploratory QA on top of the deterministic Playwright gate above,
      # never a replacement for it. Setup: docs/developing/browser-preview.mdx
      - name: Check Morph secret
        id: morph-check
        env:
          MORPH_API_KEY: ${{ secrets.MORPH_API_KEY }}
        run: |
          if [ -n "$MORPH_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Morph AI QA of preview deployment
        if: steps.morph-check.outputs.enabled == 'true' && steps.vercel-deploy.outputs.url != ''
        # Pinned to the v2 commit (tags v1/v2 both point here) — never a
        # floating tag for a third-party action receiving an API key.
        uses: morphllm/preview-test-action@5db8557c25e42df64548961440a4bc2c41a3705c # v2
        with:
          api-key: ${{ secrets.MORPH_API_KEY }}
          preview-url: ${{ steps.vercel-deploy.outputs.url }}
          instructions: |
            This is BetterShape, a desktop-agent workbench running with a
            mocked backend and fake data (no login, no real API keys).
            Exercise the screens this PR changed. Also try: the welcome
            screen's four actions (/?seed=welcome), the workbench with a
            project open (/?seed=project), Settings section navigation
            (/settings), and the Git manager (/git). Flag anything
            unclickable, overlapping, blank, or silently broken.

      - name: Comment preview link on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- bettershape-browser-preview -->";
            const url = process.env.PREVIEW_URL;
            const lines = [
              marker,
              "## Browser Preview",
              "",
              url
                ? `**Live preview:** ${url}`
                : "_No live URL from this workflow._ If the Vercel GitHub App is connected to this repo, it posts its own preview link on this PR. Otherwise download the `browser-preview` artifact from the workflow run and serve `out/` locally, or run `npm run dev:browser`.",
              "",
              "The full UI runs in your browser with a mocked Tauri backend (fake project, files, Git, chats — no real data, no model keys). Seed the open-project state by adding `?seed=project` to the URL.",
              "",
              `- Playwright report + route audit: [workflow run](${process.env.RUN_URL}) (artifacts)`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
            ];
            const body = lines.join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Step summary
        if: always()
        env:
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.url }}
        run: |
          {
            echo "## Browser Preview"
            echo ""
            if [ -n "${PREVIEW_URL:-}" ]; then
              echo "Live preview: $PREVIEW_URL"
            else
              echo "Live preview: not deployed (Vercel secrets absent or deploy skipped)."
            fi
            echo ""
            echo "Static bundle + Playwright report are attached as workflow artifacts (\`browser-preview-${{ github.sha }}\`, \`playwright-report-${{ github.sha }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
